name: NASQO Flutter Arabic release gate

on:
  push:
    branches:
      - feature/nasqo-flutter-arabic-all-20261111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasqo-arabic-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify localization keys and removal of hard-coded strings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('flutter/packages')
          for pkg,stem in [('growerp_core','core'),('growerp_order_accounting','intl'),('growerp_user_company','intl'),('growerp_inventory','intl')]:
              base=root/pkg/'lib/l10n'
              ar=json.loads((base/f'{stem}_ar.arb').read_text())
              en=json.loads((base/f'{stem}_en.arb').read_text())
              keys=lambda d:{k for k in d if not k.startswith('@')}
              assert keys(ar)==keys(en),pkg
          checks={
            'growerp_core/lib/src/templates/app_splash_screen.dart':('loadingMenuConfiguration',["message: 'Loading Menu Configuration...'"]),
            'growerp_order_accounting/lib/src/accounting/ledger/views/balance_summary_list.dart':('previousYear',["tooltip: 'Previous Year'"]),
            'growerp_order_accounting/lib/src/accounting/ledger/views/revenue_expense_chart.dart':('nextYear',["tooltip: 'Next Year'"]),
            'growerp_order_accounting/lib/src/findoc/views/findoc_dialog/add_another_item_dialog.dart':('tableHdrItemType',["labelText: 'Item Type'","labelText: 'Item Description'","labelText: 'Price/Amount'","labelText: 'Quantity'"])
          }
          for path,(key,old) in checks.items():
              s=(root/path).read_text()
              assert '.'+key in s,path
              for x in old:assert x not in s,(path,x)
          print('PASS: locale key coverage and targeted literals')
          PY

      - name: Install Flutter SDK on isolated GitHub runner
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Bootstrap and generate code
        uses: ./.github/actions/bootstrap

      - name: Analyze changed Flutter packages
        working-directory: flutter
        run: |
          flutter analyze --no-pub packages/growerp_core packages/growerp_order_accounting

      - name: Test affected Flutter packages
        working-directory: flutter
        run: |
          set -euo pipefail
          for package in growerp_core growerp_order_accounting; do
            (cd "packages/$package" && flutter test --no-pub --reporter expanded)
          done

      - name: Verify ledger filters and RTL empty states explicitly
        working-directory: flutter
        run: |
          (cd packages/growerp_core && flutter test --no-pub test/styled_data_table_rtl_test.dart)
          (cd packages/growerp_order_accounting && flutter test --no-pub test/accounting/balance_summary_filter_test.dart)

      - name: Build NASQO admin Web release
        working-directory: flutter/packages/admin
        run: flutter build web --release --pwa-strategy=none

      - name: Upload candidate artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: nasqo-arabic-web-candidate
          path: flutter/packages/admin/build/web/
          if-no-files-found: error
          retention-days: 7
