name: NASQO product CSV isolated validation

# Explicit dispatch only: no production deployment, secrets or release signing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasqo-product-csv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: ./.github/actions/bootstrap
      - name: Offline backend contract checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Analyze affected Flutter packages
        working-directory: flutter
        run: flutter analyze --no-pub packages/growerp_catalog packages/growerp_models
      - name: Run product download Bloc tests
        working-directory: flutter/packages/growerp_catalog
        run: flutter test --no-pub --reporter expanded test/product/product_bloc_test.dart
      - name: Build Web candidate without deployment
        working-directory: flutter/packages/admin
        run: flutter build web --release --no-pub
      - name: Verify web build exists
        run: test -s flutter/packages/admin/build/web/main.dart.js

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: ./.github/actions/bootstrap
      - name: Compile Android debug candidate without signing or distribution
        working-directory: flutter/packages/admin
        run: flutter build apk --debug --no-pub --target-platform android-arm64
      - name: Verify debug APK exists
        run: test -s flutter/packages/admin/build/app/outputs/flutter-apk/app-debug.apk

# Android/Web builds are compilation gates, not proof that device file save
# or SMTP delivery works. Backend tenant-isolation tests remain mandatory.
