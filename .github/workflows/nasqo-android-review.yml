name: NASQO Android APK 1.22.10 review (no publishing)
on:
  pull_request:
    branches: [release/nasqo-production-foundation]
    paths:
      - '.github/workflows/nasqo-android-review.yml'
      - 'flutter/**'
      - 'tools/test_nasqo_android_release.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # CI cannot access NASQO's persistent signing identity on the VPS.
      NASQO_BUILD_UNSIGNED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: ./.github/actions/bootstrap
      - name: Run regression tests for NASQO UI and Arabic CSV
        shell: bash
        run: |
          set -euo pipefail
          (cd flutter/packages/growerp_core && flutter test test/styled_data_table_rtl_test.dart)
          (cd flutter/packages/growerp_order_accounting && flutter test test/accounting/balance_summary_filter_test.dart)
          (cd flutter/packages/growerp_user_company && flutter test test/company_user/company_user_bloc_test.dart)
          (cd flutter/packages/growerp_user_company && flutter test test/company_user/company_user_csv_encoding_test.dart)
      - name: Generate NASQO launcher
        working-directory: flutter/packages/admin
        run: dart run flutter_launcher_icons
      - name: Build unsigned review APKs for ARM64 phones and x64 emulator
        working-directory: flutter/packages/admin
        run: |
          flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64,android-x64 --build-name=1.22.10 --build-number=147 --dart-define=BACKEND_URL=https://erp.indexesstore.com
      - name: Verify release identity, app endpoints, package integrity and alignment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist release-test-report
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"
          for abi in arm64-v8a x86_64; do
            apk="flutter/packages/admin/build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            unzip -tq "$apk"
            "$build_tools/aapt2" dump badging "$apk" > "release-test-report/$abi-badging.txt"
            grep -q "name='com.indexesstore.nasqo'" "release-test-report/$abi-badging.txt"
            grep -q "versionName='1.22.10'" "release-test-report/$abi-badging.txt"
            grep -q "versionCode='147'" "release-test-report/$abi-badging.txt"
            grep -q "native-code: '$abi'" "release-test-report/$abi-badging.txt"
            ! grep -q application-debuggable "release-test-report/$abi-badging.txt"
            "$build_tools/zipalign" -c -P 16 4 "$apk"
            cp "$apk" "dist/NASQO_ERP_Android_1.22.10_147_$abi-UNSIGNED.apk"
          done
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          for apk in Path('dist').glob('*.apk'):
              with zipfile.ZipFile(apk) as archive:
                  cfg=json.loads(archive.read('assets/flutter_assets/assets/cfg/app_settings.json'))
                  assert cfg['databaseUrl']=='https://erp.indexesstore.com'
                  assert cfg['chatUrl']=='wss://erp.indexesstore.com'
                  assert cfg['applicationId']=='AppAdmin'
                  assert cfg['appName']=='نسقو ERP'
                  assert cfg['googleLoginEnabled'] and cfg['googleRegistrationEnabled']
              assert 10_000_000 < apk.stat().st_size < 150_000_000
              print(apk.name, apk.stat().st_size)
          PY
          printf 'Build-only artifacts: DO NOT distribute unsigned APKs. Private NASQO VPS signs the reviewed release separately.\n' > dist/README-UNSIGNED.txt
          git rev-parse HEAD > dist/GITHUB_BUILD_COMMIT.txt
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Sign disposable emulator-only APK (never production key)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/nasqo-ephemeral-ci.p12" -storetype PKCS12 -storepass ci-emulator-only -keypass ci-emulator-only -alias ci-emulator -keyalg RSA -keysize 3072 -validity 2 -dname "CN=Ephemeral CI smoke test"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/nasqo-ephemeral-ci.p12" --ks-pass pass:ci-emulator-only --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$RUNNER_TEMP/nasqo-emulator-test.apk" dist/NASQO_ERP_Android_1.22.10_147_x86_64-UNSIGNED.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/nasqo-emulator-test.apk" | tee release-test-report/emulator-signature-verify.txt
      - name: Enable KVM for disposable Android emulator
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Install, launch, observe, uninstall and reinstall on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash tools/test_nasqo_android_release.sh
      - name: Upload UNSIGNED APK artifacts for private signing only
        uses: actions/upload-artifact@v4
        with:
          name: NASQO-Android-1.22.10-147-UNSIGNED-REVIEW
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NASQO-Android-1.22.10-147-TEST-REPORT
          path: release-test-report/
          if-no-files-found: warn
          retention-days: 14
