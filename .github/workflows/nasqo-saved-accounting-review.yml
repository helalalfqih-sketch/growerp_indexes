name: Saved accounting review checks
on:
  pull_request:
    paths:
      - 'backend/service/NasqoSavedAccountingReview.groovy'
      - 'backend/service/growerp/100/NasqoSavedAccountingReviewServices100.xml'
      - 'backend/service/growerp.rest.xml'
      - 'flutter/packages/admin/web/accounting-review.js'
      - 'flutter/packages/admin/web/index.html'
      - 'flutter/packages/admin/web/session-resume.js'
      - 'tools/test_session_resume.cjs'
      - 'tools/test_accounting_review_panel.cjs'
      - 'tools/NasqoAccountingDraftPlan.groovy'
      - 'tools/run_accounting_draft_plan.groovy'
      - 'tools/test_accounting_draft_plan.groovy'
      - 'tools/test_saved_accounting_review.groovy'
      - 'tools/test_saved_accounting_review.py'
      - '.github/workflows/nasqo-saved-accounting-review.yml'
permissions:
  contents: read
jobs:
  saved-accounting-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check flutter/packages/admin/web/session-resume.js
      - run: node --test tools/test_session_resume.cjs
      - run: node --check flutter/packages/admin/web/accounting-review.js
      - run: node --test tools/test_accounting_review_panel.cjs
      - run: python3 tools/test_saved_accounting_review.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test private currency decisions and preparation
        shell: bash
        run: |
          set -euo pipefail
          task_jars="$RUNNER_TEMP/nasqo-review-groovy"
          mkdir -p "$task_jars"
          curl -fLsS --retry 2 --max-time 90 https://repo.maven.apache.org/maven2/org/apache/groovy/groovy/5.1.1/groovy-5.1.1.jar -o "$task_jars/groovy-5.1.1.jar"
          curl -fLsS --retry 2 --max-time 90 https://repo.maven.apache.org/maven2/org/apache/groovy/groovy-json/5.1.1/groovy-json-5.1.1.jar -o "$task_jars/groovy-json-5.1.1.jar"
          (cd "$task_jars" && sha256sum -c <<'CHECKSUMS'
          550a072831e036aa3f6508520df1c1cb91633efa0d7d9e800a07a74227059a47  groovy-5.1.1.jar
          6589c2851642dc5141e2e5926a4ddab994449d96e958758aa7bb32df42660457  groovy-json-5.1.1.jar
          CHECKSUMS
          )
          java -cp "$task_jars/*" groovy.ui.GroovyMain tools/test_accounting_draft_plan.groovy tools/NasqoAccountingDraftPlan.groovy
          java -cp "$task_jars/*" groovy.ui.GroovyMain tools/test_saved_accounting_review.groovy backend/service/NasqoSavedAccountingReview.groovy
