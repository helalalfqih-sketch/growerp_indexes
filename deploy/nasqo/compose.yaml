# NASQO ERP: deploy only after the readiness checklist in README.md.
# No demo loaders. Database traffic stays on the internal Docker network.
x-db-env: &db-env
  POSTGRES_DB: nasqo
  POSTGRES_USER: nasqo
  POSTGRES_PASSWORD: ${NASQO_DB_PASSWORD:?Set NASQO_DB_PASSWORD in a private .env}

x-backend-env: &backend-env
  instance_purpose: production
  entity_ds_db_conf: postgres
  entity_ds_host: database
  entity_ds_port: "5432"
  entity_ds_database: nasqo
  entity_ds_schema: public
  entity_ds_user: nasqo
  entity_ds_password: ${NASQO_DB_PASSWORD:?Set NASQO_DB_PASSWORD}
  entity_ds_crypt_pass: ${NASQO_CRYPT_PASSWORD:?Set NASQO_CRYPT_PASSWORD}
  DB_DATA: NONE
  webapp_https_enabled: "true"
  webapp_https_host: ${NASQO_DOMAIN:?Set NASQO_DOMAIN}
  webapp_https_port: "443"
  webapp_http_port: "80"
  webapp_allow_origins: https://${NASQO_DOMAIN:?Set NASQO_DOMAIN}
  default_locale: ar
  default_time_zone: Asia/Aden

services:
  database:
    image: postgres:17.2
    restart: unless-stopped
    environment: *db-env
    volumes:
      - nasqo_database:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasqo -d nasqo"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: nasqo/backend:${NASQO_IMAGE_TAG:?Set NASQO_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: deploy/nasqo/Dockerfile.moqui
      args:
        NASQO_REF: ${NASQO_REF:-master}
        NASQO_COMMIT: ${NASQO_COMMIT:?Pin NASQO_COMMIT to an audited Git SHA}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - nasqo_sessions:/opt/moqui/runtime/sessions
      - nasqo_txlog:/opt/moqui/runtime/txlog
      - nasqo_logs:/opt/moqui/runtime/log
    networks: [internal]

  # One-time installation, invoked explicitly via: docker compose --profile bootstrap run --rm bootstrap
  # "install" means mandatory system configuration, NEVER the demo data type.
  bootstrap:
    profiles: [bootstrap]
    image: nasqo/backend:${NASQO_IMAGE_TAG:?Set NASQO_IMAGE_TAG}
    restart: "no"
    environment: *backend-env
    command:
      - java
      - -cp
      - .
      - MoquiStart
      - load
      - types=seed,seed-initial,install
      - conf=conf/MoquiProductionConf.xml
      - no-run-es
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - nasqo_sessions:/opt/moqui/runtime/sessions
      - nasqo_txlog:/opt/moqui/runtime/txlog
      - nasqo_logs:/opt/moqui/runtime/log
    networks: [internal]

  web:
    image: nasqo/web:${NASQO_IMAGE_TAG:?Set NASQO_IMAGE_TAG}
    build:
      context: ../../flutter
      dockerfile: ../deploy/nasqo/Dockerfile.web
      args:
        FLUTTER_VERSION: "3.47.9"
        DOCKER_TAG: ${NASQO_IMAGE_TAG:?Set NASQO_IMAGE_TAG}
    restart: unless-stopped
    volumes:
      - ./private/app_settings.json:/usr/share/nginx/html/assets/assets/cfg/app_settings.json:ro
    networks: [internal]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, backend]
    environment:
      NASQO_DOMAIN: ${NASQO_DOMAIN:?Set NASQO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nasqo_caddy_data:/data
      - nasqo_caddy_config:/config
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  nasqo_database:
  nasqo_sessions:
  nasqo_txlog:
  nasqo_logs:
  nasqo_caddy_data:
  nasqo_caddy_config:
